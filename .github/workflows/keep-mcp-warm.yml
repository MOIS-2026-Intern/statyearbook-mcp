name: Keep MCP warm

on:
  # Render 무료 인스턴스는 15분 무활동 시 정지되므로 5분 간격으로 깨운다.
  # 대상 구간은 평일 08:00~20:00 KST이다.
  # 워크스페이스 월 750 인스턴스 시간 한도 때문에 24시간 상시 핑은 걸지 않는다.
  schedule:
    # 23:00~23:59 UTC(일~목) = 08:00~08:59 KST(월~금).
    - cron: "*/5 23 * * 0-4"
    # 00:00~10:59 UTC(월~금) = 09:00~19:59 KST(월~금).
    - cron: "*/5 0-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-mcp-warm
  cancel-in-progress: false

jobs:
  ping:
    name: Ping MCP health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ping /health
        env:
          MCP_BASE_URL: ${{ vars.MCP_BASE_URL }}
        run: |
          set -u

          if [ -z "${MCP_BASE_URL}" ]; then
            echo "::error::repository variable MCP_BASE_URL is not set"
            exit 1
          fi

          health_url="${MCP_BASE_URL%/}/health"

          # 스케줄 간격(5분)이 spin-down 시간(15분)보다 훨씬 짧아 한 번만 깨워도 충분하다.
          # 재시도는 일시적인 네트워크 오류를 흡수하는 용도이므로 짧게만 기다린다.
          for attempt in 1 2 3; do
            if [ "${attempt}" -gt 1 ]; then
              sleep 10
            fi

            # 정지 상태에서 깨어나는 데 약 1분이 걸리므로 넉넉한 타임아웃을 준다.
            status=$(curl --silent --show-error --location \
              --max-time 180 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "${health_url}") || status="000"

            echo "attempt=${attempt} status=${status}"

            if [ "${status}" = "200" ]; then
              exit 0
            fi
          done

          echo "::error::MCP did not respond with 200 after 3 attempts"
          exit 1
