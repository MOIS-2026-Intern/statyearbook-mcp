name: Keep MCP warm

on:
  # Render 무료 인스턴스는 15분 무활동 시 정지되므로 5분 간격으로 깨운다.
  # 대상 구간은 평일 08:00~20:00 KST이다.
  # 워크스페이스 월 750 인스턴스 시간 한도 때문에 24시간 상시 핑은 걸지 않는다.
  schedule:
    # 23:00~23:59 UTC(일~목) = 08:00~08:59 KST(월~금).
    - cron: "*/5 23 * * 0-4"
    # 00:00~10:59 UTC(월~금) = 09:00~19:59 KST(월~금).
    - cron: "*/5 0-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-mcp-warm
  cancel-in-progress: false

jobs:
  ping:
    name: Ping MCP health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ping /health
        env:
          MCP_BASE_URL: ${{ vars.MCP_BASE_URL }}
        run: |
          set -u

          if [ -z "${MCP_BASE_URL}" ]; then
            echo "::error::repository variable MCP_BASE_URL is not set"
            exit 1
          fi

          health_url="${MCP_BASE_URL%/}/health"
          succeeded=0

          # GitHub 스케줄러가 회차를 건너뛰거나 지연시켜도 15분 안에 핑이 닿도록
          # 한 번의 실행에서 2분 간격으로 세 번 시도한다.
          for attempt in 1 2 3; do
            if [ "${attempt}" -gt 1 ]; then
              sleep 120
            fi

            # 정지 상태에서 깨어나는 데 약 1분이 걸리므로 넉넉한 타임아웃을 준다.
            status=$(curl --silent --show-error --location \
              --max-time 180 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "${health_url}") || status="000"

            echo "attempt=${attempt} status=${status}"

            if [ "${status}" = "200" ]; then
              succeeded=1
            fi
          done

          if [ "${succeeded}" -eq 0 ]; then
            echo "::error::MCP did not respond with 200 on any attempt"
            exit 1
          fi
